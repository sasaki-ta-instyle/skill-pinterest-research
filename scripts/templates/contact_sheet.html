<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1366, initial-scale=1">
<title>{{TOPIC}} — Pinterest Reference Contact Sheet</title>
<style>
  :root {
    --bg: #FAFAF7;
    --surface: #FFFFFF;
    --surface-2: #F1EFE9;
    --ink-1: #1A1A1A;
    --ink-2: #4A4A4A;
    --ink-3: #6B6B6B;
    --accent: #1A1A1A;
    --radius: 6px;
    --gap: 12px;
    --content-max: 1280px;
    --font-sans:
      "Gen Interface JP", "Inter", "Helvetica Neue", Arial,
      "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    --font-display:
      "Gen Interface JP Display", "Gen Interface JP", "Inter",
      "Helvetica Neue", Arial, "Hiragino Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink-1); }
  body {
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .page {
    max-width: var(--content-max);
    margin: 0 auto;
    padding: 32px 24px 96px;
  }
  .topbar {
    display: flex;
    align-items: baseline;
    gap: 16px;
    padding-bottom: 16px;
    margin-bottom: 32px;
    border-bottom: 1px solid var(--surface-2);
  }
  .topbar__label {
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--ink-3);
    text-transform: uppercase;
  }
  .topbar__topic {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 600;
    color: var(--ink-1);
    flex: 1;
    line-height: 1.3;
  }
  .topbar__meta {
    font-size: 11px;
    color: var(--ink-3);
    display: flex;
    gap: 14px;
    align-items: baseline;
  }
  .meta__drill { color: var(--accent); font-weight: 600; }

  .direction { margin-bottom: 56px; }
  .direction__head {
    display: grid;
    grid-template-columns: 84px 1fr;
    gap: 8px 20px;
    margin-bottom: 16px;
    padding: 16px 20px;
    background: var(--surface);
    border-radius: var(--radius);
  }
  .direction__tag {
    align-self: start;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--ink-3);
    text-transform: uppercase;
    padding-top: 4px;
  }
  .direction__title {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 18px;
    line-height: 1.4;
    color: var(--ink-1);
  }
  .direction__interp {
    grid-column: 2;
    margin: 0;
    color: var(--ink-2);
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-line;
  }

  .direction__grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 1fr;
    gap: var(--gap);
  }
  /* 3行 = 4列 * 3 = 12 件想定。スロットが少ない時は折り返しで吸収 */

  .card {
    position: relative;
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card__media {
    display: block;
    aspect-ratio: 4 / 5;
    background: var(--surface-2);
    overflow: hidden;
    text-decoration: none;
  }
  .card__media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease;
  }
  .card__media:hover img {
    transform: scale(1.025);
  }
  .card__badge {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 2;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: #FFFFFF;
    background: rgba(0, 0, 0, 0.62);
    backdrop-filter: blur(2px);
    border: 0;
    border-radius: 999px;
    padding: 4px 9px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .card__badge:hover { background: rgba(0, 0, 0, 0.82); }
  .card__badge.copied { background: #2A6F4E; }

  .card__meta {
    padding: 10px 12px 12px;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }
  .card__rationale {
    margin: 0;
    font-size: 12px;
    line-height: 1.45;
    color: var(--ink-2);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card__link {
    margin-top: auto;
    font-size: 11px;
    color: var(--ink-3);
    text-decoration: none;
  }
  .card__link:hover { color: var(--ink-1); }

  .footer {
    margin-top: 64px;
    padding-top: 16px;
    border-top: 1px solid var(--surface-2);
    font-size: 11px;
    color: var(--ink-3);
    line-height: 1.7;
  }
  .footer code {
    background: var(--surface-2);
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 11px;
  }

  @media (max-width: 980px) {
    .direction__grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media print {
    body { background: #fff; }
    .topbar, .footer { color: #000; }
    .direction { page-break-after: always; break-after: page; }
    .card__media img { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  }
</style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <span class="topbar__label">Pinterest Reference</span>
      <h1 class="topbar__topic">{{TOPIC}}</h1>
      <div class="topbar__meta">
        <span>{{GENERATED_AT}}</span>
        {{DRILL_FROM_HTML}}
      </div>
    </header>

    {{SECTIONS_HTML}}

    <footer class="footer">
      画像クリックで元ソースが別ウィンドウで開きます。<br>
      右上のバッジ（例: <code>A-c</code>）をクリックすると <code>A-c を深掘り</code> がクリップボードにコピーされます。
      そのまま Claude に貼って「方向を踏まえて再リサーチ」依頼に使ってください。
    </footer>
  </main>

  <script>
    document.querySelectorAll(".card__badge").forEach((btn) => {
      btn.addEventListener("click", async (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        const text = btn.dataset.copy || btn.textContent;
        try {
          await navigator.clipboard.writeText(text);
          const original = btn.textContent;
          btn.classList.add("copied");
          btn.textContent = "copied ✓";
          setTimeout(() => {
            btn.classList.remove("copied");
            btn.textContent = original;
          }, 1100);
        } catch (e) {
          console.warn("clipboard failed", e);
        }
      });
    });
  </script>
</body>
</html>
